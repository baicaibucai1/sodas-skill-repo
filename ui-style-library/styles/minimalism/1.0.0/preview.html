<style>
.preview{max-width:1080px}.preview h1{font-size:24px;line-height:1.25}.preview .layout{margin-top:18px}.preview .side{top:80px}.preview section{margin-bottom:24px}.preview .side a{min-height:32px}.preview .heading{margin-bottom:10px}.preview [id]{scroll-margin-top:78px}.sample-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.sample-line+.sample-line{margin-top:10px}.sample-line .field{max-width:100%}.preview .chart{margin-bottom:0}.preview .chart-head{margin-bottom:8px}.preview .palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}.swatch{margin:0;min-width:0}.swatch i{height:29px;display:block;background:var(--swatch);border:1px solid var(--line);border-radius:6px}.swatch figcaption{margin-top:4px;font-size:12px}.swatch code,.scale code,.muted{color:var(--muted);font-size:11px}.scale{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:12px}.scale b{font-size:var(--size)}.preview .metrics{margin-bottom:10px}.preview .timeline{grid-template-columns:repeat(24,minmax(0,1fr))}.preview .event-table{min-width:390px}.preview .event-table :is(th,td):first-child{width:auto}.preview .top-actions{flex-wrap:wrap}.preview-source{margin-top:12px}.preview-source a{text-decoration:underline;text-underline-offset:2px}.preview section h3{font-size:14px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.action-output{min-height:18px;margin-top:8px}.preview dialog h2{margin:0}.preview .side summary{padding-inline:9px}

<body>
<header class="topbar"><a class="brand" href="#top">UI 风格库</a><div class="top-actions"><button class="button square" type="button" id="theme" aria-label="深色模式" title="切换深浅主题" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.99 12.76a9 9 0 1 1-9.75-9.75 7 7 0 0 0 9.75 9.75z"/></svg></button></div></header>
<main id="top" class="shell preview">
  <div class="title-row"><h1>极简主义</h1><span class="badge">1.0.0</span></div>
  <p class="description">风格速览 · 监控、仪表盘、管理后台</p>
  <div class="layout">
    <nav class="side" aria-label="速览目录"><a href="#foundation" aria-current="location">色彩与排版</a><a href="#controls">按钮与表单</a><a href="#data">指标与表格</a></nav>
    <div class="content">
      <section id="foundation">
        <div class="heading"><h2>色彩与排版</h2></div>
        <div class="palette">
          <figure class="swatch" style="--swatch:var(--bg)"><i></i><figcaption>背景 <code data-color="--bg"></code></figcaption></figure>
          <figure class="swatch" style="--swatch:var(--ink)"><i></i><figcaption>正文 <code data-color="--ink"></code></figcaption></figure>
          <figure class="swatch" style="--swatch:var(--line)"><i></i><figcaption>边框 <code data-color="--line"></code></figcaption></figure>
          <figure class="swatch" style="--swatch:var(--accent)"><i></i><figcaption>选中 <code data-color="--accent"></code></figcaption></figure>
          <figure class="swatch" style="--swatch:var(--positive)"><i></i><figcaption>正常 <code data-color="--positive"></code></figcaption></figure>
          <figure class="swatch" style="--swatch:var(--warn)"><i></i><figcaption>警告 <code data-color="--warn"></code></figcaption></figure>
          <figure class="swatch" style="--swatch:var(--bad)"><i></i><figcaption>异常 <code data-color="--bad"></code></figcaption></figure>
        </div>
        <div class="scale"><span><b style="--size:24px">页面标题</b> <code>24 px</code></span><span><b style="--size:16px">区块标题</b> <code>16 px</code></span><span>正文 <code>14 px</code></span><span class="muted">辅助信息 <code>11 px</code></span></div>
      </section>
      <section id="controls">
        <div class="heading"><h2>按钮与表单</h2></div>
        <div class="sample-line"><button class="button primary" type="button" id="run">运行检测</button><button class="button" type="button" id="settings">告警设置</button><button class="button ghost" type="button" id="reset">重置选项</button><button class="button" type="button" disabled>不可用</button>
        <details class="global-menu"><summary class="menu-label">操作菜单 <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></summary><div class="menu-panel"><details class="nav-branch"><summary>监控选项</summary><div class="nav-children"><button id="menu-compare" class="button ghost" type="button">选中区域对比</button></div></details></div></details></div>
        <div class="sample-line"><input class="field" id="search" type="search" aria-label="筛选区域表格" placeholder="搜索区域"><select class="field" id="status-filter" aria-label="区域状态筛选"><option value="all">全部状态</option><option value="up">运行正常</option><option value="warn">延迟升高</option></select><div class="segmented" id="period" role="group" aria-label="时间范围"><button class="segment" type="button" data-period="24" aria-pressed="true">24 小时</button><button class="segment" type="button" data-period="72" aria-pressed="false">3 天</button></div><label class="sample-line">区域对比 <input class="switch" type="checkbox" role="switch" id="comparison"></label></div>
        <p class="muted action-output" id="feedback" role="status"></p>
      </section>
      <section id="data">
        <div class="section-head"><h2>指标与表格</h2><span class="caption" id="period-label">最近 24 小时</span></div>
        <div class="metrics"><div class="tile"><div class="tile-label">在线率</div><div class="value">100.00%</div></div><div class="tile"><div class="tile-label">可用率</div><div class="value" id="availability">99.75%</div></div></div>
        <div class="chart"><div class="chart-head"><h3>可用率时间轴</h3><span class="caption" id="series-label">全部区域</span></div><div class="timeline" id="timeline" role="img" aria-label="可用率时间轴"></div><div class="axis"><span id="start">24 小时前</span><span>现在</span></div></div>
        <div class="table-wrap preview-source" tabindex="0" role="region" aria-label="区域表格"><table class="event-table"><thead><tr><th scope="col">区域</th><th scope="col">响应延迟</th><th scope="col">状态</th></tr></thead><tbody id="rows"></tbody></table></div>
      </section>
      <footer>极简主义 · 交互风格速览</footer>
    </div>
  </div>
  <dialog class="dialog" id="dialog" aria-labelledby="dialog-title"><form method="dialog"><header><h2 id="dialog-title">告警设置</h2></header><label class="switch-row">延迟告警 <input type="checkbox" role="switch" class="switch" id="alert"></label><footer><button class="button" value="cancel">取消</button><button class="button primary" value="save">保存</button></footer></form></dialog>
</main>
<script>
const $ = id => document.getElementById(id);
const root = document.documentElement;
const nav = [...document.querySelectorAll('.side a')];
function setTheme(dark) {
  root.dataset.theme = dark ? 'dark' : 'light';
  $('theme').setAttribute('aria-pressed', dark);
  const theme = getComputedStyle(root);
  document.querySelectorAll('[data-color]').forEach(el => { el.textContent = theme.getPropertyValue(el.dataset.color).trim(); });
}
setTheme(matchMedia('(prefers-color-scheme: dark)').matches);
$('theme').onclick = () => setTheme(root.dataset.theme !== 'dark');
function activeLink() { nav.forEach(link => { if (link.hash === (location.hash || '#foundation')) link.setAttribute('aria-current','location'); else link.removeAttribute('aria-current'); }); }
addEventListener('hashchange',activeLink);activeLink();
const regions = [['弗吉尼亚','86 ms','up'],['法兰克福','103 ms','up'],['新加坡','124 ms','warn']];
let period = 24;
function updateTable() {
  const term = $('search').value.trim();
  const filter = $('status-filter').value;
  $('rows').innerHTML = regions.filter(([name,,state]) => name.includes(term) && (filter === 'all' || filter === state)).map(([name,ms,state]) => `<tr><td>${name}</td><td>${ms}</td><td><span class="badge ${state === 'up' ? 'done' : 'open'}">${state === 'up' ? '运行正常' : '延迟升高'}</span></td></tr>`).join('') || '<tr><td class="empty-row" colspan="3">没有匹配的区域</td></tr>';
}
function updateChart() {
  const compare = $('comparison').checked;
  const warnings = period === 24 ? (compare ? [9,18,19] : [18]) : (compare ? [5,10,17,18] : [5,17]);
  const incident = period === 72 ? 16 : -1;
  $('timeline').innerHTML = Array.from({length:24},(_,i) => `<span class="bar" data-state="${i === incident ? 'incident' : warnings.includes(i) ? 'degraded' : 'healthy'}"></span>`).join('');
  $('timeline').setAttribute('aria-label', `可用率时间轴：${warnings.length} 段波动，${incident < 0 ? 0 : 1} 段异常`);
  $('series-label').textContent = compare ? '区域对比：法兰克福与新加坡' : '全部区域';
  $('availability').textContent = `${(100 - (warnings.length + (incident < 0 ? 0 : 4)) * .25).toFixed(2)}%`;
  $('period-label').textContent = period === 24 ? '最近 24 小时' : '最近 3 天';
  $('start').textContent = period === 24 ? '24 小时前' : '3 天前';
  $('period').querySelectorAll('button').forEach(btn => btn.setAttribute('aria-pressed',Number(btn.dataset.period) === period));
}
$('search').oninput = updateTable;
$('status-filter').onchange = updateTable;
$('period').onclick = event => { const btn=event.target.closest('[data-period]'); if(btn){period=Number(btn.dataset.period);updateChart();} };
$('comparison').onchange = updateChart;
$('menu-compare').onclick = event => { $('comparison').checked=true; event.target.closest('.global-menu').open=false; $('comparison').focus(); updateChart(); };
$('reset').onclick = () => { $('search').value=''; $('status-filter').value='all'; $('comparison').checked=false; period=24; updateTable(); updateChart(); $('feedback').textContent='选项已重置'; };
$('run').onclick = async () => { $('run').disabled=true; $('run').textContent='检测中…'; $('feedback').textContent=''; await new Promise(resolve=>setTimeout(resolve,550)); $('run').disabled=false; $('run').textContent='运行检测'; $('feedback').textContent='模拟检测完成：3 个区域可访问'; };
let alertEnabled=false;
$('settings').onclick = () => { $('alert').checked=alertEnabled; $('dialog').returnValue=''; $('dialog').showModal(); };
$('dialog').onclose = () => { if($('dialog').returnValue==='save'){alertEnabled=$('alert').checked; $('feedback').textContent=alertEnabled?'延迟告警已开启':'延迟告警已关闭';} };
updateTable();updateChart();
</script>
</body>
</html>
